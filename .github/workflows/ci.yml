name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    name: 自检与本地服务
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 时刻推算自检
        run: npm test

      - name: 启动服务并请求首页
        run: |
          node server.js &
          sleep 1
          curl -fsS http://127.0.0.1:8788/ | grep -q "武汉地铁"
          curl -fsS http://127.0.0.1:8788/app.js > /dev/null
          curl -fsS http://127.0.0.1:8788/data.js > /dev/null

  docker:
    name: 构建镜像并冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: wuhan-metro-line8:ci

      - name: 运行容器并请求首页
        run: |
          docker run -d --name line8 -p 8788:8788 wuhan-metro-line8:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8788/ | grep -q "武汉地铁"; then
              echo "容器响应正常"; exit 0
            fi
            sleep 1
          done
          echo "容器无响应"; docker logs line8; exit 1

      - name: 清理
        if: always()
        run: docker rm -f line8 || true
